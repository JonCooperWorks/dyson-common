[package]
name = "dyson-inference-protocol"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Provider-neutral inference API routes, dialect translation, errors, and streaming adapters."
repository = "https://github.com/JonCooperWorks/dyson-common"

[lib]
path = "src/mod.rs"

[dependencies]
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
