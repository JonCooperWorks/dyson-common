[package]
name = "dyson-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cloudflare zones, DNS records and zone rules, and Workers AI account URLs, shared by Dyson products."
repository = "https://github.com/JonCooperWorks/dyson-common"

[features]
default = ["ring"]
# The Rustls crypto provider the client is built with. Pick one so an
# application keeps a single provider; with both, aws-lc-rs is used.
ring = ["rustls/ring"]
aws-lc-rs = ["rustls/aws_lc_rs"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
