[package]
name = "dyson-services"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Container service definitions, templates and Kubernetes lifecycle shared by Dyson products."
repository = "https://github.com/JonCooperWorks/dyson-common"

[features]
default = ["ring"]
ring = ["kube/ring", "rustls/ring"]
aws-lc-rs = ["kube/aws-lc-rs", "rustls/aws_lc_rs"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"
http = "1"
kube = { version = "5", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.29", features = ["v1_33"] }
rustls = { version = "0.23", default-features = false, features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
