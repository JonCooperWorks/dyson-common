# Betterleaks' generic secret rules, which Kingfisher's built-in catalog
# leaves out: a high-entropy value assigned to a key/secret/token/credential
# field (generic-api-key) and a password literal (generic-password). Loaded
# beside Kingfisher's built-ins by src/kingfisher.rs through Kingfisher's own
# Betterleaks importer.
#
# Copied verbatim from
# https://github.com/betterleaks/betterleaks/blob/95237cf8eb4d8e9f67409595b245e674832992cf/config/betterleaks.toml
# (the commit Kingfisher v2.7.0 builds its rules from).
# MIT License, Copyright (c) 2026 Zachary Rice.

[[rules]]
id = "generic-api-key"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
regex = '''(?i)(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|secret|token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:\\?['"\x60]|[\s;]|\\[nr]|$)'''
specificity = 0
confidence = "low"
keywords = [
    "access",
    "api",
    "auth",
    "key",
    "credential",
    "creds",
    "secret",
    "token",
]
filter = '''
// Provider checks use a fixed window around the match, clamped to its line.
let providerMatchContext = finding["fragment_raw"][
  max(finding["match_start_idx"] - 150, finding["match_line_start_idx"]):
  min(finding["match_end_idx"] + 50, finding["match_line_end_idx"])
];

// Recreate the generic rule's former [\w.-]{0,50} preamble. Only the
// contiguous word, dot, and hyphen suffix immediately before the match counts.
let genericMatchPrefix = filter.findMatch(
  finding["fragment_raw"][
    max(finding["match_start_idx"] - 50, finding["match_line_start_idx"]):
    finding["match_start_idx"]
  ],
  `[\w.-]{0,50}$`
);

// Recreate the generic rule's former regex which includes the [\w.-]{0,50} preamble.
let genericMatchContext =
  genericMatchPrefix +
  finding["fragment_raw"][finding["match_start_idx"]:finding["match_end_idx"]];

let level = filter.matchesAny(genericMatchContext, [
  `(?i)\b[a-z0-9]+[_.-]+token\b`
]) ? "medium" : "low";
let _ = filter.setConfidence(level);

// big ol expression to filter out FPs
entropy(finding["secret"]) <= 3.5
|| filter.failsTokenEfficiency(finding["secret"])
|| matchesAny(finding["secret"], [`^[a-zA-Z_.-]+$`])
|| (containsAny(finding["secret"], [
  "000000",
  "aaaaaa",
  "about",
  "abstract",
  "academy",
