[package]
name = "dyson-secrets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Secret detection (Kingfisher, card numbers and IBANs, external scanners) and redaction for agent traffic and traces."
repository = "https://github.com/JonCooperWorks/dyson-common"

[dependencies]
# Redaction (always on): dependency-light.
aho-corasick = "1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# `payment`: card numbers (Luhn + brand) and IBANs, with the BIN table.
card-validate = { version = "2.4", optional = true }
flate2 = { version = "1", optional = true }
iban_validate = { version = "5", optional = true }

# `kingfisher`: MongoDB's secret scanner as a library. Default features
# only: the validation features are what make network calls, and nothing
# here ever presents a found key to its issuer.
kingfisher-core = { git = "https://github.com/mongodb/kingfisher", tag = "v2.7.0", optional = true }
kingfisher-rules = { git = "https://github.com/mongodb/kingfisher", tag = "v2.7.0", optional = true }
kingfisher-scanner = { git = "https://github.com/mongodb/kingfisher", tag = "v2.7.0", optional = true }

utoipa = { version = "5", optional = true }

[features]
default = []
kingfisher = ["dep:kingfisher-core", "dep:kingfisher-rules", "dep:kingfisher-scanner"]
payment = ["dep:card-validate", "dep:flate2", "dep:iban_validate"]
# Betterleaks, TruffleHog and Nosey Parker as programs, run over batches.
external = []
utoipa = ["dep:utoipa"]

[dev-dependencies]
serde_json = "1"
